{% extends "root.html" %}

{% block title %}Reset Password{% endblock %}

{% block script %}
    <script src="/static/scripts/password_scripts.js"></script>
{% endblock %}

{% block main %}
<div class="auth-card">
    <div class="card shadow-box">
        <div class="card-body">
            <h1 class="auth-title mb-1">Reset password</h1>
            <p class="text-muted mb-4 small">Choose a new password for your account.</p>

            <form action="/reset_password/{{ token }}" method="post" id="resetForm" novalidate>
                <div class="form-group">
                    <label for="password1" class="form-label">New password</label>
                    <div class="input-with-action">
                        <input type="password" name="password1" id="password1" class="form-control" autocomplete="new-password" autofocus aria-describedby="password1-feedback">
                        <button type="button" class="input-action" data-toggle-password="password1" aria-label="Show password">Show</button>
                    </div>
                    <div class="strength-meter" id="strengthMeter" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                    <div class="field-feedback" id="password1-feedback" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="password2" class="form-label">Confirm password</label>
                    <input type="password" name="password2" id="password2" class="form-control" autocomplete="new-password" aria-describedby="password2-feedback">
                    <div class="field-feedback" id="password2-feedback" aria-live="polite"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="resetSubmit">Reset password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
