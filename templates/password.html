
{% extends "root.html" %}

{% block script %}
    <script src="/static/scripts/password_scripts.js"></script>
{% endblock %}

{% block title %}
    password
{% endblock %}

{% block main %}
        <form action="/reset_password/{{ token }}" method="post">
            <input type="password" name="password1" id="password1" placeholder="Insert password">
            <div id="passwordStrenght" class="error-message"></div>

            <input type="password" name="password2" id="password2" placeholder="Insert password again">
            <div id="error2" class="error-message"></div>

            <input type="submit" value="reset password">
        </form>
{% endblock %}
