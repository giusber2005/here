{% extends "root.html" %}

{% block title %}Reset Password{% endblock %}

{% block script %}
    <script src="/static/scripts/password_scripts.js"></script>
{% endblock %}

{% block main %}
<div class="auth-card">
    <div class="card shadow-box">
        <div class="card-body">
            <h1 class="auth-title">Reset Password</h1>
            <p class="text-muted mb-4" style="font-size:.9rem">Choose a new password for your account.</p>

            <form action="/reset_password/{{ token }}" method="post">
                <div class="mb-3">
                    <label for="password1" class="form-label">New Password</label>
                    <input type="password" name="password1" id="password1" placeholder="New password" class="form-control required" autofocus>
                    <div id="passwordStrenght" class="mt-1 error" style="font-size:.8rem;"></div>
                </div>

                <div class="mb-3">
                    <label for="password2" class="form-label">Confirm Password</label>
                    <input type="password" name="password2" id="password2" placeholder="Repeat new password" class="form-control required">
                    <div id="error2" class="mt-1 error" style="font-size:.8rem;"></div>
                </div>

                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
