
{% extends "root.html" %}

{% block script %}
    <script src="https://cdn.jsdelivr.net/npm/rrule@2.6.8/dist/es5/rrule.min.js"></script>
    <script src="/static/scripts/password_scripts.js"></script>
{% endblock %}

{% block title %}
    password
{% endblock %}

{% block main %}
        <form action="/reset_password/{{ token }}" method="post">
            <div id="container" class="form-container">
                <div id="required-fields" class="form-section">
                    <div class="form-group">
                        <div class="input-container">
                            <label for="password1" class="form-label">Password:</label>
                            <input type="password" name="password1" id="password1" placeholder="Insert password" class="form-control required">
                        </div>
                        <div id="passwordStrenght" class="error error-message" style="background-color: aliceblue;"></div>
                    </div>
        
                    <div class="form-group">
                        <div class="input-container">
                            <label for="password2" class="form-label">Repeat:</label>
                            <input type="password" name="password2" id="password2" placeholder="Insert password again" class="form-control required">    
                        </div>
                        <div id="error2" class="error error-message" style="background-color: aliceblue;"></div>
                    </div>    
                </div>
            </div>

            <div class="form-group">
                <input type="submit" value="Reset password" class="btn btn-primary" style="margin-top: 10px">
            </div>
        </form>
{% endblock %}
