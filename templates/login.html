{% extends "root.html" %}

{% block title %}Log In{% endblock %}

{% block script %}
<script>
    document.addEventListener('DOMContentLoaded', () => Validation.bindPasswordToggles());
</script>
{% endblock %}

{% block main %}
<div class="auth-card">
    <div class="card shadow-box">
        <div class="card-body">
            <h1 class="auth-title mb-1">Welcome back</h1>
            <p class="text-muted small mb-4">Log in to see your calendar and friends.</p>

            <form action="/login" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input autocomplete="username" autocapitalize="none" autofocus class="form-control" id="username" name="username" type="text" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-with-action">
                        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                        <button type="button" class="input-action" data-toggle-password="password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button class="btn btn-primary w-100 m-0 mt-1" type="submit">Log in</button>
            </form>

            <button class="btn btn-ghost btn-sm mt-3 mx-0" type="button" data-bs-toggle="collapse" data-bs-target="#forgotCollapse">
                Forgot your password?
            </button>
            <div class="collapse" id="forgotCollapse">
                <div class="inset-panel mt-2">
                    <p class="mb-2 text-muted small">Enter your email and we'll send you a reset link.</p>
                    <form action="/password" method="post" class="d-flex gap-2">
                        <input type="email" placeholder="Your email address" name="Email" id="Email" class="form-control" required>
                        <button type="submit" class="btn btn-primary m-0">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <p class="text-center mt-3 text-muted small">
        New to HERE? <a href="/register" class="link-primary-strong">Create an account</a>
    </p>
</div>
{% endblock %}
