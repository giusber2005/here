{% extends "root.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <div id="container" class="form-container">
        <h1 id="title" class="text-center" style="text-align: left">LOG IN</h1>
        <form action="/login" method="post" class="form-container">
            <div class="form-group">
                <div class="input-container">
                    <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text">
                </div>
            </div>
            <div class="form-group">
                <div class="input-container">
                    <input class="form-control" name="password" placeholder="Password" type="password">
                </div>
            </div>

            <div class="form-group">
                <button class="btn btn-primary" type="submit">Log In</button>

                <button class="btn btn-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapse">
                    You don't remember the password?
                </button>
            </div>
        </form>
    </div>



    <div class="collapse" id="collapse">
        <div class="card card-body">
            <form action="/password" method="post">
                <div class="form-group">
                    <div class="input-container">
                        <input type="email" placeholder="Insert your email" name="Email" id="Email" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-left: 5px">Send Email</button>
                </div>
            </form>
        </div>
    </div>

{% endblock %}
