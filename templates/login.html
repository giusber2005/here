{% extends "root.html" %}

{% block title %}Log In{% endblock %}

{% block main %}
<div class="auth-card">
    <div class="card shadow-box">
        <div class="card-body">
            <h1 class="auth-title">Log In</h1>

            <form action="/login" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Enter username" type="text">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input class="form-control" id="password" name="password" placeholder="Enter password" type="password">
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-primary" type="submit">Log In</button>
                    <button class="btn btn-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#forgotCollapse">
                        Forgot password?
                    </button>
                </div>
            </form>

            <div class="collapse mt-3" id="forgotCollapse">
                <div class="card card-body mt-2">
                    <p class="mb-2 text-muted" style="font-size:.875rem">Enter your email and we'll send a reset link.</p>
                    <form action="/password" method="post" class="d-flex gap-2">
                        <input type="email" placeholder="Your email address" name="Email" id="Email" class="form-control">
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <p class="text-center mt-3 text-muted" style="font-size:.875rem">
        Don't have an account? <a href="/register" style="color:var(--primary);font-weight:600">Register</a>
    </p>
</div>
{% endblock %}
