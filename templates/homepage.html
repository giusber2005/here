{% extends "root.html" %}

{% block script %}
    <style>
        #calendar {
            max-width: 900px;
            margin: 40px auto;
        }
        #eventForm {
            display: none;
            position: fixed; /* Changed from absolute to fixed */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000; /* Added z-index */
        }
    </style>

    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js'></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var eventForm = document.getElementById('eventForm');
            var addEventForm = document.getElementById('addEventForm');
            var cancelButton = document.getElementById('cancelButton');
            var calendar;

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                selectable: true,
                editable: true,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek,multiMonthYear'
                },
                views: {
                    timeGridWeek: {
                        type: 'timeGridWeek',
                        buttonText: 'week'
                    },
                    listWeek: {
                        type: 'listWeek',
                        buttonText: 'list week'
                    },
                    multiMonthYear: {
                        type: 'multiMonthYear',
                        duration: { months: 12 },
                        buttonText: 'year'
                    }
                },
                events: [
                    // Your event data here
                ],
                select: function(info) {
                    eventForm.style.display = 'block';
                    document.body.classList.add('dimmed');
                    addEventForm.onsubmit = function(e) {
                        e.preventDefault();
                        var title = document.getElementById('eventTitle').value;
                        var color = document.getElementById('eventColor').value;
                        var eventData;
                        if (title) {
                            eventData = {
                                title: title,
                                start: info.startStr,
                                end: info.endStr,
                                color: color // Assigning the user-defined color
                            };
                            calendar.addEvent(eventData);
                        }
                        eventForm.style.display = 'none';
                        document.body.classList.remove('dimmed');
                        calendar.unselect();
                    };
                    cancelButton.onclick = function() {
                        eventForm.style.display = 'none';
                        document.body.classList.remove('dimmed');
                        calendar.unselect();
                    };
                },
                eventClick: function(info) {
                    if (confirm('Are you sure you want to delete this event?')) {
                        info.event.remove();
                    }
                }
            });
            calendar.render();
        });
    </script>

{% endblock %}

{% block title %}
    homepage
{% endblock %}

{% block body %}
    <div id='calendar'></div>

    <div id="eventForm">
        <h2>Add Event</h2>
        <form id="addEventForm">
            <label for="eventTitle">Event Title:</label><br>
            <input type="text" id="eventTitle" name="eventTitle" required><br><br>
            <label for="eventColor">Event Color:</label><br>
            <input type="color" id="eventColor" name="eventColor" value="#ff0000" required><br><br>
            <button type="submit">Add Event</button>
            <button type="button" id="cancelButton">Cancel</button>
        </form>
    </div>
{% endblock %}
