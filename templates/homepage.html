{% extends "root.html" %}

{% block script %}
    <style>
        /* Basic styling for the layout */
        #calendar {
            width: 75%;
            float: left;
        }
        
        #eventDetails {
            width: 25%;
            float: right;
            padding: 10px;
            border-left: 2px solid #ccc;
            display: none; /* Initially hidden */
        }

        #eventForm {
            display: none;
            position: fixed; /* Changed from absolute to fixed */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000; /* Added z-index */
        }
    </style>

    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js'></script>
    <script src="/static/scripts/calendar_scripts.js"></script>

{% endblock %}

{% block title %}
    homepage
{% endblock %}

{% block body %}
    <div id='calendar'></div>

    <div id="eventDetails">
        <h3>Event Details</h3>
        <p><strong>Title:</strong> <span id="detailTitle"></span></p>
        <p><strong>Start:</strong> <span id="detailStart"></span></p>
        <p><strong>End:</strong> <span id="detailEnd"></span></p>
        <p><strong>Color:</strong> <span id="detailColor"></span></p>
        <p><strong>Text:</strong> <span id="detailText"></span></p>
        <p><strong>Link:</strong> <a id="detailLink" href="#" target="_blank">Event Link</a></p>
        <p><strong>Tags:</strong> <span id="detailTags"></span></p>
    </div>

    <div id="eventForm" style="display: none;">
        <form id="addEventForm">
            <label for="eventTitle">Event Title:</label>
            <input type="text" id="eventTitle" name="eventTitle" required>
            
            <label for="eventColor">Event Color:</label>
            <input type="color" id="eventColor" name="eventColor">
            
            <label for="eventText">Additional Text:</label>
            <textarea id="eventText" name="eventText"></textarea>
            
            <label for="eventLink">Event Link:</label>
            <input type="url" id="eventLink" name="eventLink">
            
            <label for="eventTags">Tags (comma-separated):</label>
            <input type="text" id="eventTags" name="eventTags">
            
            <button type="submit">Add Event</button>
            <button type="button" id="cancelButton">Cancel</button>
        </form>
    </div>
{% endblock %}
