
{% extends "root.html" %}

{% block script %}
    <style>
        /* Basic styling for the layout */
        .calendar-container {
            display: flex;
            width: 100%;
            gap: 20px;
        }

        #calendar {
            flex: 2;
        }

        #eventDetails {
            flex: 1;
            padding: 10px;
            border-left: 2px solid #ccc;
            display: none; /* Initially hidden */
        }

        #eventForm {
            display: none;
            position: fixed; /* Changed from absolute to fixed */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000; /* Added z-index */
            width: 300px;
            border-radius: 8px; /* Added some rounding */
        }

        #eventForm form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #eventForm label {
            font-weight: bold;
        }

        #eventForm input, #eventForm textarea, #eventForm button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #eventForm button {
            cursor: pointer;
        }

        #cancelButton {
            background-color: #f44336;
            color: white;
            border: none;
        }

        #addEventForm button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        /* Custom styles for FullCalendar */
        .fc .fc-toolbar-title, /* Month name */
        .fc .fc-col-header-cell-cushion, /* Day names (like Sun, Mon, etc.) */
        .fc .fc-daygrid-day-number { /* Day numbers in the calendar */
            color: #333 !important; /* Modify default blue color */
        }

        /* Modify link styles inside the calendar */
        .fc a {
            color: #333 !important; /* Link color */
            text-decoration: none; /* Remove underline */
        }

        .fc a:hover {
            color: #4CAF50 !important; /* Hover color */
            text-decoration: underline; /* Underline on hover */
        }

        /* Target the FullCalendar table specifically */
        #calendar .fc-scrollgrid, /* Main table that holds the calendar grid */
        #calendar .fc-scrollgrid-sync-table { /* Inner table for the calendar content */
            background-color: white; /* Change the background color */
            border: 1px solid #ccc; /* Optional: Add a border around the table */
            width: 100%; /* Ensure it takes up full width */
            opacity: 1; /* Ensure no transparency */
        }

        #eventBox {
            display: flex;
            flex-direction: row;
            justify-content: space-between; /* This pushes the items to the sides */
            align-items: center; /* Optional: vertically centers the items */
            width: 100%; /* Optional: defines the width of the flex container */
        }

        #linkBox {
            position: fixed; /* Fixes the div to the viewport */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centers the div */
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); /* Optional shadow for better visibility */
            z-index: 9999; /* Ensures the div is in front of all other elements */
        }

        /* css code to style the div inside the addEvent form as button */
        .button-like-div {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff; /* Blue background */
            border: 1px solid #007bff; /* Blue border */
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .button-like-div:hover {
            background-color: #0056b3; /* Darker blue on hover */
            border-color: #0056b3;
        }

        .button-like-div:active {
            background-color: #003d80; /* Even darker blue on click */
            border-color: #003d80;
        }
    </style>


    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js'></script>
    <script src="/static/scripts/calendar_scripts.js"></script>

{% endblock %}

{% block title %}
    Homepage
{% endblock %}

{% block body %}

    <div id="blurry">
        <section class="calendar-container">
            <div id='calendar'></div>

            <aside id="eventDetails">
                <div id="eventBox">
                    <h3>Event Details</h3>
                    <button id="closeButton" class="btn btn-primary"> Close </button>
                </div>
                <p><strong>Title:</strong> <span id="detailTitle"></span></p>
                <p><strong>Time Slot:</strong> <span id="detailStart"></span></p>
                <p><strong>Description:</strong> <span id="detailText"></span></p>
                <p style="display: inline-block"><strong>Links:&nbsp;</strong> <div id="altLink" style="display: inline-block"></div> <a id="detailLink" href="#" target="_blank" style="display: inline-block">Event Link</a> </p>
                <p><strong>Tags:</strong> <span id="detailTags"></span></p>

                <div style="display: flex; flex-direction: row">
                    <button id="modifyButton" class="btn btn-primary"> Modify </button>
                    <button id="deleteButton" class="btn btn-primary"> Delete </button>
                </div>
            </aside>
        </section>

        <article id="eventForm" style="display: none; background-color: grey">
            <form id="addEventForm">
                <label for="eventTitle">Event Title:</label>
                <input type="text" id="eventTitle" name="eventTitle" required aria-required="true">
                
                <label for="eventColor">Event Color:</label>
                <input type="color" id="eventColor" name="eventColor">
                
                <label for="eventText">Notes:</label>
                <textarea id="eventText" name="eventText" rows="4"></textarea>
                
                <label for="eventLink">Event Link:</label>
                <div id="hiddenBox" style="display: none"></div>
                <input type="url" id="eventLink" name="eventLink">
                <div class="button-like-div" id="addLink">Add link</div>
                <div class="button-like-div" id="showLink"> Show all links </div>

                <label for="eventTags">Tag:</label>
                <select id="eventTags" name="eventTags" class="form-control">
                    <option value=""></option>
                    <option value="Work">🔴 Work</option>
                    <option value="Entertainment">⚪️ Entertainment</option>
                    <option value="Other">🔵 Other</option>
                </select>

                <div class="button-group">
                    <button id="addButton" type="submit">Add Event</button>
                    <button type="button" id="cancelButton">Cancel</button>
                </div>
            </form>
        </article>
    </div>

    <div id="linkBox" style="display: None">
        <button id="closeLink">❌</button>
    </div>
    
{% endblock %}
